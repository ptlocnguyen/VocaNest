<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#35c6a1" />
  <title>VocaNest - Quên mật khẩu</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/ui.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body class="auth-page">
  <main class="center">
    <div class="auth-simple">
      <section class="card">
        <div class="auth-header">
          <div>
            <h1>Khôi phục mật khẩu</h1>
            <p>Nhập email đã đăng ký. Chúng tôi sẽ gửi link đặt lại mật khẩu cho bạn.</p>
          </div>
        </div>

        <div class="auth-form">
          <div class="auth-field">
            <label class="label" for="email">Email</label>
            <input id="email" class="input" type="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <button id="btnSend" class="btn primary block" type="button">Gửi link khôi phục</button>
          <div id="msg" class="alert" style="display:none;"></div>
        </div>

        <a class="auth-simple__back" href="./auth.html">← Quay lại đăng nhập</a>
      </section>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apiClient.js"></script>
  <script src="../assets/js/forgotPassword.js"></script>
</body>
</html>
