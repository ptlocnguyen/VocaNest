<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#35c6a1" />
  <title>VocaNest - Chi tiết bộ từ</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/ui.css" />
  <link rel="stylesheet" href="../assets/css/vocab-set-detail.css" />
  <link rel="stylesheet" href="../assets/css/footer.css" />
</head>
<body class="detail-page">
  <header class="app-header">
    <div class="app-header__left">
      <a href="./home.html" class="logo">VocaNest</a>
      <nav class="nav" aria-label="Điều hướng chính">
        <a class="nav__link is-active" href="./vocab-sets.html">Bộ từ vựng</a>
        <a class="nav__link" href="./grammar.html">Ngữ pháp</a>
      </nav>
    </div>
    <div class="user-area">
      <a id="userAccount" class="user-account" href="./account.html" title="Tài khoản">
        <span class="user-account__icon" aria-hidden="true"></span>
        <span id="userEmail" class="user-account__text"></span>
      </a>
    </div>
  </header>

  <main class="main">
    <section class="card set-info-card">
      <div class="set-info-card__copy">
        <p id="setMeta" class="set-info-meta"></p>
        <h1 id="setTitle" class="set-info-title"></h1>
      </div>
      <a href="./vocab-sets.html" class="btn">← Quay lại thư viện</a>
    </section>

    <div class="two-cols two-cols--detail">
      <section id="addSection" class="card detail-panel">
        <div class="section-head">
          <h2>Thêm từ mới</h2>
          <p class="muted" id="editHint">Nhập từ tiếng Anh và nghĩa tương ứng.</p>
        </div>
        <div class="form-grid">
          <div class="row">
            <div class="col">
              <label class="label" for="wordInput">Từ vựng</label>
              <input id="wordInput" class="input" placeholder="Ví dụ: benefit" />
            </div>
            <div class="col">
              <label class="label" for="meaningInput">Nghĩa</label>
              <input id="meaningInput" class="input" placeholder="Ví dụ: lợi ích" />
            </div>
          </div>
          <button id="addBtn" class="btn primary" type="button">Thêm vào bộ</button>
          <div id="addAlert" class="alert" style="display:none;"></div>
        </div>

        <div class="import-box">
          <div>
            <label class="label" for="excelInput">Nhập từ file Excel</label>
            <p class="muted">Sử dụng hai cột: từ vựng và nghĩa.</p>
          </div>
          <input id="excelInput" type="file" class="input file-input" accept=".xlsx,.xls" />
          <div id="importAlert" class="alert" style="display:none;"></div>
        </div>
      </section>

      <section class="card vocab-list-card detail-panel">
        <div class="section-head section-head--between">
          <div>
            <h2>Danh sách từ</h2>
            <p class="muted">Tìm kiếm và quản lý từ trong bộ.</p>
          </div>
          <a id="flashcardsLink" class="btn primary btn-flashcards" href="#"><i data-lucide="layers-3"></i> Học flashcards</a>
        </div>
        <input id="searchInput" class="input" type="search" placeholder="Tìm theo từ hoặc nghĩa..." />
        <div id="vocabItems" class="list"></div>
      </section>
    </div>
  </main>

  <footer class="app-footer simple-footer">
    <div class="footer-bottom">© 2026 VocaNest · Learn English every day</div>
  </footer>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>if (window.lucide) window.lucide.createIcons();</script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apiClient.js"></script>
  <script src="../assets/js/authGuard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../assets/js/vocabSetDetail.js"></script>
  <script>
    (() => {
      const setId = new URLSearchParams(window.location.search).get("id");
      const flashLink = document.getElementById("flashcardsLink");
      if (setId && flashLink) {
        flashLink.href = `./flashcards.html?set=${encodeURIComponent(setId)}`;
      } else if (flashLink) {
        flashLink.style.display = "none";
      }
    })();
  </script>
</body>
</html>
