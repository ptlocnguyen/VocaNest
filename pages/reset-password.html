<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#35c6a1" />
  <title>VocaNest - Đặt lại mật khẩu</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/ui.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body class="auth-page">
  <main class="center">
    <div class="auth-simple">
      <section class="card">
        <div class="auth-header">
          <div>
            <h1>Tạo mật khẩu mới</h1>
            <p>Sử dụng mật khẩu có ít nhất 6 ký tự và dễ nhớ với riêng bạn.</p>
          </div>
        </div>

        <div class="auth-form">
          <div class="auth-field">
            <label class="label" for="newPassword">Mật khẩu mới</label>
            <input id="newPassword" class="input" type="password" minlength="6" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" />
          </div>
          <button id="btnReset" class="btn primary block" type="button">Cập nhật mật khẩu</button>
          <div id="msg" class="alert" style="display:none;"></div>
        </div>

        <a class="auth-simple__back" href="./auth.html">← Quay lại đăng nhập</a>
      </section>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/apiClient.js"></script>
  <script src="../assets/js/resetPassword.js"></script>
</body>
</html>
