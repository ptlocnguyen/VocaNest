<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#35c6a1" />
  <title>VocaNest</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/index.css" />
</head>
<body>
  <main class="center">
    <section class="loading-shell" aria-live="polite">
      <div class="loading-mark">V</div>
      <h1>VocaNest</h1>
      <p>Đang chuẩn bị không gian học của bạn...</p>
      <div class="loading-line" aria-hidden="true"></div>
    </section>
  </main>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/apiClient.js"></script>
  <script>
    (async () => {
      try {
        if (!window.vocaApi.getToken()) {
          window.location.href = "./pages/auth.html";
          return;
        }

        if (window.vocaApi.getCachedUser()) {
          window.location.href = "./pages/home.html";
          return;
        }

        const { user } = await window.vocaApi.authPost("me");
        window.vocaApi.setCurrentUser(user);
        window.location.href = "./pages/home.html";
      } catch (err) {
        console.error(err);
        window.vocaApi.setToken("");
        window.location.href = "./pages/auth.html";
      }
    })();
  </script>
</body>
</html>
